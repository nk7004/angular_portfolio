<section id="hero" class="hero-section">
  <!-- Glowing Background Nodes -->
  <div class="hero-glow hero-glow-1"></div>
  <div class="hero-glow hero-glow-2"></div>

  <!-- Topography Background Lines -->
  <div class="topography-bg">
    <svg viewBox="0 0 1440 800" fill="none" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
      <path d="M-100,200 C300,100 500,400 900,150 C1200,50 1300,300 1600,100" stroke="currentColor" stroke-width="1"
        class="topo-line" />
      <path d="M-100,280 C320,180 520,480 920,230 C1220,130 1320,380 1620,180" stroke="currentColor" stroke-width="1"
        class="topo-line" />
      <path d="M-100,360 C340,260 540,560 940,310 C1240,210 1340,460 1640,260" stroke="currentColor" stroke-width="1"
        class="topo-line" />
      <path d="M-100,440 C360,340 560,640 960,390 C1260,290 1360,540 1660,340" stroke="currentColor" stroke-width="1"
        class="topo-line" />
      <path d="M200,700 C400,600 700,800 1100,550 C1300,450 1400,700 1700,500" stroke="currentColor" stroke-width="1"
        class="topo-line" />
      <path d="M200,780 C420,680 720,880 1120,630 C1320,530 1420,780 1720,580" stroke="currentColor" stroke-width="1"
        class="topo-line" />
    </svg>
  </div>

  <!-- Floating Tech Particles -->
  <div class="floating-particle part-plus">+</div>
  <div class="floating-particle part-code">&lt;code/&gt;</div>
  <div class="floating-particle part-data">REST API</div>

  <div class="container hero-container">
    <!-- Hero Left: Bio, Headlines, Stats & CTAs -->
    <div class="hero-content">
      <span class="welcome-eyebrow">Welcome to my portfolio!</span>
      <h1 class="hero-main-title">Hello, my name's <span class="name-highlight">{{ firstName }}</span>.</h1>
      <p class="hero-description">{{ positioningStatement }}</p>

      <!-- Quick stats dashboard row -->
      <div class="hero-stats">
        <div class="stat-item">
          <span class="stat-number text-gradient-primary">3+ Years</span>
          <span class="stat-label">Full Stack Experience</span>
        </div>
        <div class="stat-divider"></div>
        <div class="stat-item">
          <span class="stat-number text-gradient-primary">6+ Systems</span>
          <span class="stat-label">Enterprise Projects</span>
        </div>
        <div class="stat-divider"></div>
        <div class="stat-item">
          <span class="stat-number text-gradient-primary">AWS EC2</span>
          <span class="stat-label">Cloud Deployment</span>
        </div>
      </div>

      <div class="hero-actions">
        <a href="Nitish_Kumar_Resume.pdf" download="Nitish_Kumar_Resume.pdf" class="btn btn-cv-glow" target="_blank"
          rel="noopener noreferrer">
          Download cv
        </a>
        <a href="#projects" (click)="onViewWorkClick($event)" class="btn btn-outline-pill">
          See my work
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="btn-arrow">
            <line x1="5" y1="12" x2="19" y2="12"></line>
            <polyline points="12 5 19 12 12 19"></polyline>
          </svg>
        </a>
      </div>

      <!-- Mouse Scroll Down Indicator -->
      <a href="#about" (click)="onScrollDownClick($event)" class="scroll-down-indicator">
        <div class="mouse-icon">
          <span class="mouse-wheel"></span>
        </div>
        <span class="scroll-text">Scroll down</span>
      </a>
    </div>

    <!-- Hero Right: Oval Profile Frame with floating 3D shapes -->
    <div class="hero-visual">
      <div class="visual-wrapper">
        <!-- Oval Portrait Portal Frame -->
        <div class="profile-portal">
          <img src="assets/WhatsApp Image 2026-08-12 at 11.26.22 AM.jpeg" alt="Nitish Kumar" class="profile-img">
        </div>
      </div>
    </div>

    <!-- Right Edge: Vertical Follow socials -->
    <div class="follow-sidebar">
      <span class="follow-text">FOLLOW ME ON</span>
      <div class="sidebar-line"></div>
      <div class="sidebar-socials">
        <a *ngFor="let link of socialLinks" [href]="link.url" target="_blank" rel="noopener noreferrer"
          class="circle-social-btn" [attr.aria-label]="link.platform" [title]="link.platform">

          <svg *ngIf="link.iconName === 'github'" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="sidebar-icon">
            <path
              d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3 0 6-2 6-5.5.08-1.25-.27-2.48-1-3.5.28-1.15.28-2.35 0-3.5 0 0-1 0-3 1.5-2.64-.5-5.36-.5-8 0C6 2 5 2 5 2c-.3 1.15-.3 2.35 0 3.5A5.403 5.403 0 0 0 4 9c0 3.5 3 5.5 6 5.5-.39.49-.68 1.05-.85 1.65-.17.6-.22 1.23-.15 1.85v4">
            </path>
            <path d="M9 18c-4.51 2-5-2-7-2"></path>
          </svg>

          <svg *ngIf="link.iconName === 'linkedin'" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="sidebar-icon">
            <path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z"></path>
            <rect width="4" height="12" x="2" y="9"></rect>
            <circle cx="4" cy="4" r="2"></circle>
          </svg>

          <svg *ngIf="link.iconName === 'mail'" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="sidebar-icon">
            <rect width="20" height="16" x="2" y="4" rx="2"></rect>
            <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path>
          </svg>
        </a>
      </div>
    </div>
  </div>
</section>
