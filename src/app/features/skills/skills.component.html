<section id="skills" class="section skills-section">
  <div class="container">
    <div class="skills-header">
      <span class="eyebrow">Skills &amp; Tech Stack</span>
      <h2 class="section-title">Technical Competence &amp; Stack</h2>
      <p class="subtitle">
        Interactive view of my engineering capabilities across the entire deployment stack. Select a category to inspect details.
      </p>
    </div>

    <!-- Tabbed Dashboard Workspace -->
    <div class="skills-dashboard-layout">
      <!-- Left sidebar: Tab Selectors -->
      <div class="skills-tab-sidebar">
        <button *ngFor="let cat of skillCategories; let i = index" 
                (click)="setActiveCategory(i)"
                [ngClass]="{ 'active': activeCategoryIndex() === i }"
                class="skill-tab-btn"
                [attr.aria-selected]="activeCategoryIndex() === i"
                role="tab">
          
          <div class="tab-icon-box">
            <svg *ngIf="cat.iconName === 'layout'" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="tab-svg">
              <rect width="18" height="18" x="3" y="3" rx="2" ry="2"></rect>
              <line x1="3" y1="9" x2="21" y2="9"></line>
              <line x1="9" y1="21" x2="9" y2="9"></line>
            </svg>
            <svg *ngIf="cat.iconName === 'server'" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="tab-svg">
              <rect width="20" height="8" x="2" y="2" rx="2" ry="2"></rect>
              <rect width="20" height="8" x="2" y="14" rx="2" ry="2"></rect>
              <line x1="6" y1="6" x2="6.01" y2="6"></line>
              <line x1="6" y1="18" x2="6.01" y2="18"></line>
            </svg>
            <svg *ngIf="cat.iconName === 'database'" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="tab-svg">
              <ellipse cx="12" cy="5" rx="9" ry="3"></ellipse>
              <path d="M3 5V19A9 3 0 0 0 21 19V5"></path>
              <path d="M3 12A9 3 0 0 0 21 12"></path>
            </svg>
            <svg *ngIf="cat.iconName === 'cloud'" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="tab-svg">
              <path d="M17.5 19A3.5 3.5 0 0 0 21 15.5c0-2.79-2.54-4.5-5-4.5-.47-2.33-2.34-4-4.5-4a4.42 4.42 0 0 0-4.5 4.5C4.5 11.5 2 13.5 2 16.5A3.5 3.5 0 0 0 5.5 20h12Z"></path>
            </svg>
            <svg *ngIf="cat.iconName === 'settings'" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="tab-svg">
              <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.1a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
          </div>
          <span class="tab-label-text">{{ cat.category }}</span>
        </button>
      </div>

      <!-- Right Column: Detail Stack Panel -->
      <div class="skills-detail-panel glass-card">
        <div class="panel-border-line"></div>
        <div class="panel-inner-content">
          <h3 class="panel-stack-title text-gradient-primary">{{ activeCategory.category }} Stack</h3>
          <p class="panel-stack-description">{{ activeDescription }}</p>
          
          <div class="panel-badges-grid">
            <div *ngFor="let skill of activeCategory.skills" class="skill-detail-card">
              <span class="skill-detail-name">{{ skill.name }}</span>
              <span class="skill-detail-indicator"></span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
